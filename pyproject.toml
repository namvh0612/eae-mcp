[project]
name = "eae-mcp"
version = "0.5.0"
description = "MCP server to read, explain and edit EcoStruxure Automation Expert (EAE) 26 solutions: types, networks, CATs, .NET HMI and eHMI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eae-mcp = "eae_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eae_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
